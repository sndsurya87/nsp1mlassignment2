[project]
name = "shopper-intent"
version = "1.0.0"
description = "Comparison of five classifiers on the UCI Online Shoppers Purchasing Intention dataset."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
